apply plugin: 'com.android.library'

group = 'com.nihongoclass'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace "com.nihongoclass.googlesignin"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Credential Manager's "Sign in with Google", which Google recommends in place of
  // the deprecated Google Sign-In for Android. Version 1.3.0 builds with compileSdk 34,
  // the version Expo SDK 51 uses.
  implementation "androidx.credentials:credentials:1.3.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
  implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
}
