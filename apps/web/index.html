<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2A4A7F" />
    <meta name="description" content="Study Japanese with your class or on your own, from N5 to N1." />
    <link rel="icon" href="/favicon-64.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- §13: Google serves Japanese fonts in unicode-range slices; display=swap. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=Klee+One:wght@400;600&display=swap"
    />
    <title>Nihongo Class</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Diagnostic: surface any JS error on screen so a blank WebView at least shows what crashed. Safe to leave in. -->
    <div id="__err" style="display:none;position:fixed;inset:0;z-index:9999;padding:1rem;font:14px/1.4 system-ui;color:#000;background:#fff;overflow:auto;white-space:pre-wrap;word-break:break-word"></div>
    <script>
      (function () {
        var box = document.getElementById("__err");
        function show(where, msg) { box.style.display = "block"; box.textContent = (box.textContent ? box.textContent + "\n\n" : "") + where + ": " + msg; }
        window.addEventListener("error", function (e) { show("error", (e.error && (e.error.stack || e.error.message)) || e.message || String(e)); });
        window.addEventListener("unhandledrejection", function (e) { show("unhandled promise", (e.reason && (e.reason.stack || e.reason.message)) || String(e.reason)); });
        setTimeout(function () { if (!document.getElementById("root").children.length && !box.textContent) show("timeout", "App did not render after 8s. URL=" + location.href); }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
